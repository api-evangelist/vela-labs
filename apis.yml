aid: vela-labs
name: Vela Labs
description: 'Vela Labs, Inc. (Vela, formerly Hive) is a San Francisco company founded
  in 2018 by Justin Killian and Jason Abaluck that provides an AI-driven platform
  helping eCommerce sellers manage, optimize, and grow their businesses across multiple
  channels from a single account. Vela supports Etsy, Shopify, eBay, and Faire, offering
  bulk listing editing, AI-assisted listing creation and optimization, photo editing,
  and multi-channel publishing for tens of thousands of sellers. A 500 Global portfolio
  company that has raised $5.5M. Vela consumes the official APIs of the marketplaces
  it supports but publishes no public API, developer portal, or machine-readable
  surface of its own.'
